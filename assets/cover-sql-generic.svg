<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <radialGradient id="sql-stage-glow" cx="50%" cy="46%" r="58%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
            <stop offset="46%" stop-color="#D7D7D7" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#09090A" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="sql-diag-plane" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D7D7D7" stop-opacity="0.065" />
            <stop offset="100%" stop-color="#D7D7D7" stop-opacity="0.015" />
        </linearGradient>

        <linearGradient id="sql-cylinder-top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F5F5F5" />
            <stop offset="100%" stop-color="#C8C8C8" />
        </linearGradient>

        <linearGradient id="sql-cylinder-body" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1E1E20" />
            <stop offset="45%" stop-color="#2D2D30" />
            <stop offset="100%" stop-color="#141416" />
        </linearGradient>

        <pattern id="sql-arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Obsidian Base Surface matching Portfolio & Hero Dark Stage -->
    <rect width="800" height="500" fill="#0B0B0C" />
    <rect width="800" height="500" fill="url(#sql-arch-grid)" />

    <!-- Subtle Diagonal Plane echoing Hero Stone Split -->
    <polygon points="0,0 320,0 245,500 0,500" fill="url(#sql-diag-plane)" />
    <line x1="320" y1="0" x2="245" y2="500" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

    <!-- Studio Spotlight Radial Depth -->
    <rect width="800" height="500" fill="url(#sql-stage-glow)" />

    <!-- Outer Architectural Framing Marks -->
    <path d="M 42 54 V 34 H 62" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 758 54 V 34 H 738" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 42 446 V 466 H 62" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 758 446 V 466 H 738" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Subtle Connecting Schema Lines -->
    <path d="M 150 220 H 290 M 510 220 H 650" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="150" cy="220" r="3" fill="#D7D7D7" fill-opacity="0.45" />
    <circle cx="650" cy="220" r="3" fill="#D7D7D7" fill-opacity="0.45" />

    <!-- Architectural Side Nodes (Star / Medallion Cue) -->
    <g opacity="0.55">
        <rect x="114" y="198" width="36" height="44" fill="#141416" stroke="#D7D7D7" stroke-opacity="0.32" stroke-width="1.2" />
        <line x1="122" y1="212" x2="142" y2="212" stroke="#D7D7D7" stroke-opacity="0.65" stroke-width="1.5" />
        <line x1="122" y1="221" x2="138" y2="221" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />
        <line x1="122" y1="230" x2="140" y2="230" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />

        <rect x="650" y="198" width="36" height="44" fill="#141416" stroke="#D7D7D7" stroke-opacity="0.32" stroke-width="1.2" />
        <line x1="658" y1="212" x2="678" y2="212" stroke="#D7D7D7" stroke-opacity="0.65" stroke-width="1.5" />
        <line x1="658" y1="221" x2="674" y2="221" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />
        <line x1="658" y1="230" x2="676" y2="230" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />
    </g>

    <!-- Centerpiece Architectural SQL Database Stack -->
    <g transform="translate(400, 206)">
        <!-- Cast Shadow -->
        <ellipse cx="0" cy="112" rx="98" ry="18" fill="#000000" fill-opacity="0.72" />

        <!-- Bottom Tier -->
        <path d="M -86 38 V 78 C -86 93 -47 104 0 104 C 47 104 86 93 86 78 V 38 Z"
              fill="url(#sql-cylinder-body)" stroke="#D7D7D7" stroke-opacity="0.55" stroke-width="1.8" />
        <path d="M -86 38 C -86 53 -47 64 0 64 C 47 64 86 53 86 38"
              stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" />

        <!-- Middle Tier -->
        <path d="M -86 -6 V 34 C -86 49 -47 60 0 60 C 47 60 86 49 86 34 V -6 Z"
              fill="url(#sql-cylinder-body)" stroke="#D7D7D7" stroke-opacity="0.72" stroke-width="1.8" />
        <path d="M -86 -6 C -86 9 -47 20 0 20 C 47 20 86 9 86 -6"
              stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />

        <!-- Top Tier -->
        <path d="M -86 -50 V -10 C -86 5 -47 16 0 16 C 47 16 86 5 86 -10 V -50 Z"
              fill="url(#sql-cylinder-body)" stroke="#F5F5F5" stroke-width="2" />
        <ellipse cx="0" cy="-50" rx="86" ry="24"
                 fill="url(#sql-cylinder-top)" stroke="#FFFFFF" stroke-width="2" />

        <!-- Subtle Structural Inner Ring on Top Cap -->
        <ellipse cx="0" cy="-50" rx="56" ry="13.5" stroke="#0B0B0C" stroke-opacity="0.22" stroke-width="1.5" />

        <!-- Minimal Status / Indexing Ticks on Tiers -->
        <circle cx="-54" cy="14" r="2.5" fill="#F5F5F5" />
        <circle cx="-54" cy="58" r="2.5" fill="#D7D7D7" fill-opacity="0.85" />
        <circle cx="-54" cy="-24" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Editorial SQL Emblem Box (Matches Section Box Brackets on Site) -->
    <g transform="translate(400, 382)">
        <line x1="-116" y1="-20" x2="-116" y2="20" stroke="#FFFFFF" stroke-width="2.5" />
        <line x1="116" y1="-20" x2="116" y2="20" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="-114" y="-20" width="228" height="40" fill="#141416" fill-opacity="0.85" />
        <text x="0" y="6"
              text-anchor="middle"
              font-family="Montserrat, 'Open Sans', system-ui, sans-serif"
              font-size="16"
              font-weight="800"
              letter-spacing="5.5"
              fill="#F5F5F5">T-SQL · QUERY</text>
    </g>

    <!-- Subtle Monogram Corner Stamp -->
    <g transform="translate(44, 434)" opacity="0.42">
        <rect x="0" y="-14" width="24" height="24" stroke="#D7D7D7" stroke-width="1.4" />
        <text x="12" y="3"
              text-anchor="middle"
              font-family="Montserrat, system-ui, sans-serif"
              font-size="9.5"
              font-weight="800"
              letter-spacing="0.8"
              fill="#D7D7D7">MN</text>
    </g>
</svg>
