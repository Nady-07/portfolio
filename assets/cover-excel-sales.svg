<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <!-- Background Radial Gradient -->
        <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>

        <!-- Blue Aura Glow Behind Logo -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="45" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Drop Shadow for Front Plate -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
        </filter>

        <!-- Excel Brand Gradients -->
        <linearGradient id="excel-back" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#107c41" />
            <stop offset="100%" stop-color="#0b5930" />
        </linearGradient>
        <linearGradient id="excel-front" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#21a366" />
            <stop offset="100%" stop-color="#107c41" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="800" height="450" fill="url(#bg-glow)" />

    <!-- Glow Effect -->
    <circle cx="400" cy="225" r="100" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />

    <!-- Excel Logo (Centered) -->
    <g>
        <!-- Back plate (Sheet grid) -->
        <rect x="390" y="165" width="100" height="120" rx="6" fill="url(#excel-back)" />
        
        <!-- Grid Cells -->
        <rect x="410" y="180" width="22" height="20" rx="2" fill="#ffffff" opacity="0.2" />
        <rect x="442" y="180" width="32" height="20" rx="2" fill="#ffffff" opacity="0.2" />
        <rect x="410" y="210" width="22" height="20" rx="2" fill="#ffffff" opacity="0.2" />
        <rect x="442" y="210" width="32" height="20" rx="2" fill="#ffffff" opacity="0.2" />
        <rect x="410" y="240" width="22" height="20" rx="2" fill="#ffffff" opacity="0.2" />
        <rect x="442" y="240" width="32" height="20" rx="2" fill="#ffffff" opacity="0.2" />

        <!-- Front plate (X symbol) -->
        <rect x="310" y="175" width="100" height="100" rx="8" fill="url(#excel-front)" filter="url(#shadow)" />
        
        <!-- X character paths -->
        <path d="M335 195 L350 195 L360 215 L370 195 L385 195 L368 225 L385 255 L370 255 L360 235 L350 255 L335 255 L352 225 Z" fill="#ffffff" />
    </g>
</svg>
