<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <!-- Background Radial Gradient -->
        <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>

        <!-- Blue Aura Glow Behind Logo -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="45" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Power BI Brand Gradients -->
        <linearGradient id="pbi-left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E6A100" />
            <stop offset="100%" stop-color="#F2C811" />
        </linearGradient>
        <linearGradient id="pbi-middle" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F2C811" />
            <stop offset="100%" stop-color="#F9D949" />
        </linearGradient>
        <linearGradient id="pbi-right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F9D949" />
            <stop offset="100%" stop-color="#FFE082" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="800" height="450" fill="url(#bg-glow)" />

    <!-- Glow Effect -->
    <circle cx="400" cy="225" r="100" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />

    <!-- Power BI Logo (Centered) -->
    <g transform="translate(0, 5)">
        <!-- Left short bar -->
        <rect x="335" y="220" width="34" height="60" rx="5" fill="url(#pbi-left)" />
        <!-- Middle bar -->
        <rect x="383" y="180" width="34" height="100" rx="5" fill="url(#pbi-middle)" />
        <!-- Right tall bar -->
        <rect x="431" y="140" width="34" height="140" rx="5" fill="url(#pbi-right)" />
    </g>
</svg>
