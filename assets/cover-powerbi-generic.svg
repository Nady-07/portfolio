<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <radialGradient id="pbi-stage-glow" cx="50%" cy="46%" r="58%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
            <stop offset="46%" stop-color="#D7D7D7" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#09090A" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="pbi-diag-plane" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D7D7D7" stop-opacity="0.065" />
            <stop offset="100%" stop-color="#D7D7D7" stop-opacity="0.015" />
        </linearGradient>

        <linearGradient id="pbi-bar-bright" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F5F5F5" />
            <stop offset="100%" stop-color="#C8C8C8" />
        </linearGradient>

        <linearGradient id="pbi-bar-dark" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1E1E20" />
            <stop offset="45%" stop-color="#2D2D30" />
            <stop offset="100%" stop-color="#141416" />
        </linearGradient>

        <linearGradient id="pbi-bar-mid" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2A2A2D" />
            <stop offset="45%" stop-color="#3E3E42" />
            <stop offset="100%" stop-color="#1C1C1F" />
        </linearGradient>

        <pattern id="pbi-arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Obsidian Base Surface matching Portfolio & Hero Dark Stage -->
    <rect width="800" height="500" fill="#0B0B0C" />
    <rect width="800" height="500" fill="url(#pbi-arch-grid)" />

    <!-- Subtle Diagonal Plane echoing Hero Stone Split -->
    <polygon points="0,0 320,0 245,500 0,500" fill="url(#pbi-diag-plane)" />
    <line x1="320" y1="0" x2="245" y2="500" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

    <!-- Studio Spotlight Radial Depth -->
    <rect width="800" height="500" fill="url(#pbi-stage-glow)" />

    <!-- Outer Architectural Framing Marks -->
    <path d="M 42 54 V 34 H 62" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 758 54 V 34 H 738" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 42 446 V 466 H 62" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 758 446 V 466 H 738" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Subtle Connecting Semantic Model Lines -->
    <path d="M 150 220 H 290 M 510 220 H 650" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="150" cy="220" r="3" fill="#D7D7D7" fill-opacity="0.45" />
    <circle cx="650" cy="220" r="3" fill="#D7D7D7" fill-opacity="0.45" />

    <!-- Architectural Side Nodes (Star Schema & KPI Cue) -->
    <g opacity="0.55">
        <!-- Left Dim Table Node -->
        <rect x="114" y="198" width="36" height="44" fill="#141416" stroke="#D7D7D7" stroke-opacity="0.32" stroke-width="1.2" />
        <line x1="114" y1="208" x2="150" y2="208" stroke="#D7D7D7" stroke-opacity="0.35" stroke-width="1" />
        <line x1="122" y1="217" x2="142" y2="217" stroke="#D7D7D7" stroke-opacity="0.65" stroke-width="1.5" />
        <line x1="122" y1="226" x2="138" y2="226" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />
        <line x1="122" y1="234" x2="140" y2="234" stroke="#D7D7D7" stroke-opacity="0.4" stroke-width="1.5" />

        <!-- Right Mini Chart Node -->
        <rect x="650" y="198" width="36" height="44" fill="#141416" stroke="#D7D7D7" stroke-opacity="0.32" stroke-width="1.2" />
        <rect x="658" y="222" width="4" height="11" fill="#D7D7D7" fill-opacity="0.45" />
        <rect x="666" y="216" width="4" height="17" fill="#D7D7D7" fill-opacity="0.65" />
        <rect x="674" y="209" width="4" height="24" fill="#F5F5F5" fill-opacity="0.85" />
    </g>

    <!-- Centerpiece Architectural Power BI Sculpture -->
    <g transform="translate(400, 206)">
        <!-- Cast Shadow -->
        <ellipse cx="0" cy="112" rx="98" ry="18" fill="#000000" fill-opacity="0.72" />

        <!-- Subtle Structural Baseline Axis -->
        <line x1="-94" y1="102" x2="94" y2="102" stroke="#D7D7D7" stroke-opacity="0.32" stroke-width="1.2" />

        <!-- Pillar 1 (Left, Shortest, Obsidian Tier) -->
        <rect x="-76" y="18" width="44" height="84" fill="url(#pbi-bar-dark)" stroke="#D7D7D7" stroke-opacity="0.58" stroke-width="1.8" />
        <line x1="-68" y1="30" x2="-40" y2="30" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
        <circle cx="-54" cy="86" r="2.2" fill="#D7D7D7" fill-opacity="0.85" />

        <!-- Cast Depth Seam between Pillar 1 & 2 -->
        <rect x="-32" y="-22" width="10" height="122" fill="#000000" fill-opacity="0.55" />

        <!-- Pillar 2 (Center, Medium, Brushed Slate Tier) -->
        <rect x="-22" y="-26" width="44" height="128" fill="url(#pbi-bar-mid)" stroke="#D7D7D7" stroke-opacity="0.82" stroke-width="1.8" />
        <line x1="-22" y1="-26" x2="22" y2="-26" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="2" />
        <line x1="-13" y1="-12" x2="13" y2="-12" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" />
        <circle cx="0" cy="86" r="2.2" fill="#F5F5F5" />

        <!-- Cast Depth Seam between Pillar 2 & 3 -->
        <rect x="22" y="-70" width="10" height="170" fill="#000000" fill-opacity="0.55" />

        <!-- Pillar 3 (Right, Tallest Focal Pillar, Platinum-White Matching SQL Top Cap) -->
        <rect x="32" y="-74" width="44" height="176" fill="url(#pbi-bar-bright)" stroke="#FFFFFF" stroke-width="2" />
        <!-- Structural Inner Frame on Bright Bar -->
        <rect x="39" y="-66" width="30" height="160" stroke="#0B0B0C" stroke-opacity="0.18" stroke-width="1.2" />
        <!-- Minimal Scale Marks -->
        <line x1="45" y1="-50" x2="63" y2="-50" stroke="#0B0B0C" stroke-opacity="0.26" stroke-width="1.5" />
        <line x1="45" y1="-41" x2="58" y2="-41" stroke="#0B0B0C" stroke-opacity="0.18" stroke-width="1.5" />
        <circle cx="54" cy="86" r="2.4" fill="#0B0B0C" fill-opacity="0.72" />

        <!-- Architectural Trend Vector Linking Pillar Peaks -->
        <path d="M -54 4 L 0 -40 L 54 -88" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="3 4" />
        <circle cx="-54" cy="4" r="3" fill="#0B0B0C" stroke="#D7D7D7" stroke-width="1.4" />
        <circle cx="0" cy="-40" r="3" fill="#0B0B0C" stroke="#F5F5F5" stroke-width="1.4" />
        <circle cx="54" cy="-88" r="3.4" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.2" />
    </g>

    <!-- Editorial Power BI Emblem Box (Matches SQL Bracket Framing) -->
    <g transform="translate(400, 382)">
        <line x1="-132" y1="-20" x2="-132" y2="20" stroke="#FFFFFF" stroke-width="2.5" />
        <line x1="132" y1="-20" x2="132" y2="20" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="-130" y="-20" width="260" height="40" fill="#141416" fill-opacity="0.85" />
        <text x="0" y="6"
              text-anchor="middle"
              font-family="Montserrat, 'Open Sans', system-ui, sans-serif"
              font-size="16"
              font-weight="800"
              letter-spacing="5.5"
              fill="#F5F5F5">POWER BI &#183; DAX</text>
    </g>

    <!-- Subtle Monogram Corner Stamp -->
    <g transform="translate(44, 434)" opacity="0.42">
        <rect x="0" y="-14" width="24" height="24" stroke="#D7D7D7" stroke-width="1.4" />
        <text x="12" y="3"
              text-anchor="middle"
              font-family="Montserrat, system-ui, sans-serif"
              font-size="9.5"
              font-weight="800"
              letter-spacing="0.8"
              fill="#D7D7D7">MN</text>
    </g>
</svg>
